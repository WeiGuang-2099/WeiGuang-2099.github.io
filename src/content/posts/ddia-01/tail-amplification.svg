<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="264" style="font-family: var(--font-text, 'Noto Sans SC', 'PingFang SC', sans-serif); overflow: visible">
  <!-- One end-user request fanning out to four backend calls in parallel, drawn as a trace. The root span
       ends only after the slowest child (C) returns. Proportions are illustrative, not measured. No viewBox:
       text keeps its size at any width, bars are placed in percentages. Colors are the site's tokens. -->

  <!-- axis: request received (0%) to response returned (100%) -->
  <g style="font-size: 12.5px; fill: var(--muted, #596170)">
    <text x="0" y="12">收到用户请求</text>
    <text x="100%" y="12" text-anchor="end">返回响应</text>
  </g>
  <line x1="0" y1="24.5" x2="100%" y2="24.5" style="stroke: var(--rule-strong, #B4BAC4); stroke-width: 1" />

  <!-- root span: the end-user request, 0-100% -->
  <text x="0" y="52" style="font-size: 14px; font-weight: 500; fill: var(--ink, #13161B)">用户请求<tspan dx="8" style="font-size: 12.5px; font-weight: 400; fill: var(--muted, #596170)">end-user request</tspan></text>
  <rect x="0" y="60" width="100%" height="8" rx="1" style="fill: var(--ink, #13161B)" />

  <!-- backend calls, all sent at 2%; only C is slow -->
  <text x="0" y="100" style="font-size: 14px; font-weight: 500; fill: var(--ink, #13161B)">后端调用 A</text>
  <text x="100%" y="100" text-anchor="end" style="font-size: 12.5px; fill: var(--muted, #596170)">快</text>
  <rect x="2%" y="108" width="28%" height="8" rx="1" style="fill: var(--muted, #596170)" />

  <text x="0" y="148" style="font-size: 14px; font-weight: 500; fill: var(--ink, #13161B)">后端调用 B</text>
  <text x="100%" y="148" text-anchor="end" style="font-size: 12.5px; fill: var(--muted, #596170)">快</text>
  <rect x="2%" y="156" width="20%" height="8" rx="1" style="fill: var(--muted, #596170)" />

  <text x="0" y="196" style="font-size: 14px; font-weight: 500; fill: var(--ink, #13161B)">后端调用 C</text>
  <text x="100%" y="196" text-anchor="end" style="font-size: 12.5px; font-weight: 500; fill: var(--ink, #13161B)">慢，整个请求都在等它</text>
  <rect x="2%" y="204" width="94%" height="8" rx="1" style="fill: var(--ink, #13161B)" />

  <text x="0" y="244" style="font-size: 14px; font-weight: 500; fill: var(--ink, #13161B)">后端调用 D</text>
  <text x="100%" y="244" text-anchor="end" style="font-size: 12.5px; fill: var(--muted, #596170)">快</text>
  <rect x="2%" y="252" width="32%" height="8" rx="1" style="fill: var(--muted, #596170)" />
</svg>
