<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="330" style="font-family: var(--font-text, 'Noto Serif SC', 'Songti SC', serif); overflow: visible">
  <!-- The write and read paths of an LSM-tree storage engine (LevelDB / RocksDB style). A rule splits memory
       (above) from disk (below). A write is appended to the write-ahead log on disk and inserted into the
       memtable, a balanced tree kept sorted by key; once the memtable passes a few MB it is written out as a
       new SSTable, so SSTable 3 is the newest and SSTable 1 the oldest. A background job merges SSTables
       (here 2 and 1) into one. A read (the dashed line) tries the memtable, then the SSTables from newest to
       oldest, in the numbered order, and stops at the first hit; it never reads the log.
       Layout: the log column is 0-36% with the write line at 18%; the memtable and the SSTables share the
       46-87% column, with the write-out edge at 66%. The read line runs 13.5px inside the right edge and the
       merge line 15.5px left of the SSTable column, placed through nested svgs or a translate, so every edge
       is horizontal or vertical and the arrowheads hold at any width. Lines are drawn first; the boxes,
       filled with the page color, cover their ends. Percentage-placed strokes sit in a translate(-0.5 0)
       group, so at 300px they fall on whole pixels. No viewBox: text keeps its size. Colors are the site's
       tokens, with light-theme fallbacks. -->

  <!-- the memory / disk rule -->
  <line x1="0" y1="146.5" x2="100%" y2="146.5" style="stroke: var(--rule-strong, #B1B8BB); stroke-width: 1" />
  <g style="font-size: 12.5px; fill: var(--muted, #5D6672)">
    <text x="0" y="140">内存</text>
    <text x="0" y="164">磁盘</text>
  </g>

  <!-- read path, dashed: from 读取 down the right edge, a stub into each box it tries -->
  <g style="fill: none; stroke: var(--ink, #1B222B); stroke-width: 1; stroke-dasharray: 4 3">
    <svg x="100%" y="0" overflow="visible"><line x1="-13.5" y1="22" x2="-13.5" y2="267.5" /></svg>
    <g transform="translate(-13.5 0)">
      <line x1="100%" y1="75.5" x2="87%" y2="75.5" />
      <line x1="100%" y1="191.5" x2="87%" y2="191.5" />
      <line x1="100%" y1="229.5" x2="87%" y2="229.5" />
      <line x1="100%" y1="267.5" x2="87%" y2="267.5" />
    </g>
  </g>

  <g transform="translate(-0.5 0)">
    <!-- write path: down to the log, across into the memtable; the memtable written out as an SSTable -->
    <g style="stroke: var(--ink, #1B222B); stroke-width: 1">
      <line x1="18%" y1="22" x2="18%" y2="170" />
      <line x1="18%" y1="75.5" x2="46%" y2="75.5" />
      <line x1="66%" y1="100.5" x2="66%" y2="170" />
    </g>
    <g style="fill: var(--ink, #1B222B)">
      <svg x="18%" y="176" overflow="visible"><path d="M-3.5 -8H3.5L0 0Z" /></svg>
      <svg x="46%" y="75.5" overflow="visible"><path d="M-8.5 -3.5V3.5L-0.5 0Z" /></svg>
      <svg x="66%" y="176" overflow="visible"><path d="M-3.5 -8H3.5L0 0Z" /></svg>
      <!-- read stubs end on the right edge of each box -->
      <svg x="87%" y="75.5" overflow="visible"><path d="M8.5 -3.5V3.5L0.5 0Z" /></svg>
      <svg x="87%" y="191.5" overflow="visible"><path d="M8.5 -3.5V3.5L0.5 0Z" /></svg>
      <svg x="87%" y="229.5" overflow="visible"><path d="M8.5 -3.5V3.5L0.5 0Z" /></svg>
      <svg x="87%" y="267.5" overflow="visible"><path d="M8.5 -3.5V3.5L0.5 0Z" /></svg>
    </g>

    <!-- background merge: SSTables 2 and 1 leave on the left, join, and go into the merged SSTable -->
    <svg x="46%" y="0" overflow="visible">
      <path d="M0 229.5H-15V313.5H-8.5M-15 267.5H0" style="fill: none; stroke: var(--muted, #5D6672); stroke-width: 1" />
      <path d="M-8.5 310V317L-0.5 313.5Z" style="fill: var(--muted, #5D6672)" />
    </svg>

    <!-- memtable, SSTables 3 2 1, and the merged SSTable: 46% to 87% -->
    <g style="fill: var(--bg, #F5F6F3); stroke: var(--rule-strong, #B1B8BB); stroke-width: 1">
      <rect x="46%" y="50.5" width="41%" height="50" />
      <rect x="46%" y="176.5" width="41%" height="30" />
      <rect x="46%" y="214.5" width="41%" height="30" />
      <rect x="46%" y="252.5" width="41%" height="30" />
      <rect x="46%" y="298.5" width="41%" height="30" />
    </g>
  </g>

  <!-- the write-ahead log: 0 to 36% -->
  <rect x="0.5" y="176.5" width="36%" height="72" style="fill: var(--bg, #F5F6F3); stroke: var(--rule-strong, #B1B8BB); stroke-width: 1" />
  <text x="12" y="198" style="font-size: 14px; font-weight: 500; fill: var(--ink, #1B222B)">预写日志</text>
  <g style="font-size: 12.5px; fill: var(--muted, #5D6672)">
    <text x="12" y="219">只追加，不排序</text>
    <text x="12" y="237">仅供崩溃恢复</text>
  </g>

  <!-- box labels in the right column -->
  <svg x="46%" y="0" overflow="visible">
    <g style="font-size: 14px; font-weight: 500; fill: var(--ink, #1B222B)">
      <text x="12" y="71">memtable</text>
      <text x="12" y="196.5">SSTable 3<tspan dx="8" style="font-size: 12.5px; font-weight: 400; fill: var(--muted, #5D6672)">最新</tspan></text>
      <text x="12" y="234.5">SSTable 2</text>
      <text x="12" y="272.5">SSTable 1<tspan dx="8" style="font-size: 12.5px; font-weight: 400; fill: var(--muted, #5D6672)">最旧</tspan></text>
    </g>
    <text x="12" y="90" style="font-size: 12.5px; fill: var(--muted, #5D6672)">按键排序的平衡树</text>
    <text x="12" y="318" style="font-size: 12.5px; fill: var(--ink, #1B222B)">合并后的 SSTable</text>
    <text x="-21.5" y="318" text-anchor="end" style="font-size: 12.5px; fill: var(--muted, #5D6672)">后台合并、压实</text>
  </svg>

  <!-- the write-out edge's label, left of the edge -->
  <svg x="66%" y="0" overflow="visible">
    <g text-anchor="end" style="font-size: 12.5px; fill: var(--muted, #5D6672)">
      <text x="-8" y="120">超过几 <tspan style="font-family: var(--font-mono, monospace)">MB</tspan> 后</text>
      <text x="-8" y="136">写成新 SSTable</text>
    </g>
  </svg>

  <!-- the two requests -->
  <text x="18%" y="14" text-anchor="middle" style="font-size: 14px; font-weight: 500; fill: var(--ink, #1B222B)">写入</text>
  <svg x="100%" y="0" overflow="visible">
    <text x="-14" y="14" text-anchor="middle" style="font-size: 14px; font-weight: 500; fill: var(--ink, #1B222B)">读取</text>
    <text x="-22" y="36" text-anchor="end" style="font-size: 12.5px; fill: var(--muted, #5D6672)">命中即停</text>
    <!-- the read order, on the read line -->
    <g style="fill: var(--bg, #F5F6F3); stroke: var(--ink, #1B222B); stroke-width: 1">
      <circle cx="-13.5" cy="75.5" r="8" />
      <circle cx="-13.5" cy="191.5" r="8" />
      <circle cx="-13.5" cy="229.5" r="8" />
      <circle cx="-13.5" cy="267.5" r="8" />
    </g>
    <g text-anchor="middle" style="font-family: var(--font-mono, monospace); font-size: 12.5px; fill: var(--ink, #1B222B)">
      <text x="-13.5" y="80">1</text>
      <text x="-13.5" y="196">2</text>
      <text x="-13.5" y="234">3</text>
      <text x="-13.5" y="272">4</text>
    </g>
  </svg>
</svg>
