<!-- English version of encoding-sizes.svg, written by npm run translate from source 5dfaea049fd0ed6a. Adjust the layout here if a label does not fit; the file is only written again when encoding-sizes.svg changes. -->
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="324" style="font-family: var(--font-text, 'Noto Serif SC', 'Songti SC', serif); overflow: visible">
  <!-- The book's example record encoded six ways, one row per format, sizes in bytes. Each size is a
       dimension line (a 1px rule between two end ticks) from 0 to size/81 of the width, so every row is on
       one scale where JSON's 81 bytes = 100%: 66 = 81.48%, 59 = 72.84%, 34 = 41.98%, 33 = 40.74%,
       32 = 39.51%. The format name sits on a line above its rule and the size is right-aligned on that
       same line, so no label meets a rule at any width. JSON and MessagePack write the field names into
       every record (muted); the four schema-based formats leave them out (ink); a thin rule and a small
       label above each group mark the split. Left ticks sit at x=0.5; right ticks are shifted half a
       pixel left (translate) so each line ends exactly at its percentage. No viewBox: text keeps its
       size. Colors are the site's tokens, with light-theme fallbacks. -->

  <!-- group 1: field names travel inside every record -->
  <text x="0" y="12" style="font-size: 12.5px; fill: var(--muted, #5D6672)">field names written into every record</text>

  <text x="0" y="40" style="font-size: 14px; font-weight: 500; fill: var(--muted, #5D6672)">JSON<tspan dx="8" style="font-size: 12.5px; font-weight: 400">whitespace removed</tspan></text>
  <text x="0" y="84" style="font-size: 14px; font-weight: 500; fill: var(--muted, #5D6672)">MessagePack</text>
  <g style="font-family: var(--font-mono, monospace); font-size: 12.5px; fill: var(--muted, #5D6672)">
    <text x="100%" y="40" text-anchor="end">81 B</text>
    <text x="100%" y="84" text-anchor="end">66 B</text>
  </g>
  <g style="stroke: var(--muted, #5D6672); stroke-width: 1">
    <!-- JSON 81: 0 to 100% -->
    <line x1="0" y1="52.5" x2="100%" y2="52.5" />
    <line x1="0.5" y1="47" x2="0.5" y2="58" />
    <!-- MessagePack 66: 0 to 81.48% -->
    <line x1="0" y1="96.5" x2="81.48%" y2="96.5" />
    <line x1="0.5" y1="91" x2="0.5" y2="102" />
    <g transform="translate(-0.5 0)">
      <line x1="100%" y1="47" x2="100%" y2="58" />
      <line x1="81.48%" y1="91" x2="81.48%" y2="102" />
    </g>
  </g>

  <!-- the split between the two groups -->
  <line x1="0" y1="116.5" x2="100%" y2="116.5" style="stroke: var(--rule, #DADDD8); stroke-width: 1" />

  <!-- group 2: the schema carries the field names -->
  <text x="0" y="142" style="font-size: 12.5px; fill: var(--ink, #1B222B)">schema omits field names</text>

  <g style="font-size: 14px; font-weight: 500; fill: var(--ink, #1B222B)">
    <text x="0" y="170">Thrift BinaryProtocol</text>
    <text x="0" y="214">Thrift CompactProtocol</text>
    <text x="0" y="258">Protocol Buffers</text>
    <text x="0" y="302">Avro</text>
  </g>
  <g style="font-family: var(--font-mono, monospace); font-size: 12.5px; fill: var(--ink, #1B222B)">
    <text x="100%" y="170" text-anchor="end">59 B</text>
    <text x="100%" y="214" text-anchor="end">34 B</text>
    <text x="100%" y="258" text-anchor="end">33 B</text>
    <text x="100%" y="302" text-anchor="end">32 B</text>
  </g>
  <g style="stroke: var(--ink, #1B222B); stroke-width: 1">
    <!-- Thrift BinaryProtocol 59: 0 to 72.84% -->
    <line x1="0" y1="182.5" x2="72.84%" y2="182.5" />
    <line x1="0.5" y1="177" x2="0.5" y2="188" />
    <!-- Thrift CompactProtocol 34: 0 to 41.98% -->
    <line x1="0" y1="226.5" x2="41.98%" y2="226.5" />
    <line x1="0.5" y1="221" x2="0.5" y2="232" />
    <!-- Protocol Buffers 33: 0 to 40.74% -->
    <line x1="0" y1="270.5" x2="40.74%" y2="270.5" />
    <line x1="0.5" y1="265" x2="0.5" y2="276" />
    <!-- Avro 32: 0 to 39.51% -->
    <line x1="0" y1="314.5" x2="39.51%" y2="314.5" />
    <line x1="0.5" y1="309" x2="0.5" y2="320" />
    <g transform="translate(-0.5 0)">
      <line x1="72.84%" y1="177" x2="72.84%" y2="188" />
      <line x1="41.98%" y1="221" x2="41.98%" y2="232" />
      <line x1="40.74%" y1="265" x2="40.74%" y2="276" />
      <line x1="39.51%" y1="309" x2="39.51%" y2="320" />
    </g>
  </g>
</svg>
