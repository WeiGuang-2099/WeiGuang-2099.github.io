<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="200" style="font-family: var(--font-text, 'Noto Serif SC', 'Songti SC', serif); overflow: visible">
  <!-- The book's Mr. Poons and Mrs. Cake example of a consistent-prefix violation, drawn as a trace.
       Time runs left to right. Each bar is one message, from the moment it is written to its partition's
       leader to the moment it reaches that partition's follower: the question goes to partition 1 at 0%
       and replicates slowly (0-86%); the answer, written later, goes to partition 2 at 30% and replicates
       fast (30-48%). The observer reads from the followers, so the bottom line shows the answer at 48%
       and the question at 86%. Dotted guides drop from each bar's end to the observer's line; they are
       drawn first so the bars and ticks cover their ends. Proportions are illustrative. No viewBox: text
       keeps its size, bars are placed in percentages. Colors are the site's tokens, with light-theme
       fallbacks. -->

  <!-- axis: when the two sentences are said (written to the leaders) -->
  <g style="font-size: 12.5px; fill: var(--muted, #5D6672)">
    <text x="0" y="12">提问</text>
    <text x="30%" y="12">回答</text>
  </g>
  <line x1="0" y1="24.5" x2="100%" y2="24.5" style="stroke: var(--rule-strong, #B1B8BB); stroke-width: 1" />
  <g style="stroke: var(--rule-strong, #B1B8BB); stroke-width: 1">
    <line x1="0.5" y1="19" x2="0.5" y2="30" />
    <line x1="30%" y1="19" x2="30%" y2="30" />
  </g>

  <!-- each message reaches the observer when it reaches its follower -->
  <g style="stroke: var(--faint, #757D87); stroke-width: 1; stroke-dasharray: 2 3">
    <line x1="86%" y1="68" x2="86%" y2="166" />
    <line x1="48%" y1="116" x2="48%" y2="166" />
  </g>

  <!-- the question: partition 1, slow replication, 0-86% -->
  <text x="0" y="52" style="font-size: 14px; font-weight: 500; fill: var(--ink, #1B222B)">Poons 先生的问题<tspan dx="8" style="font-size: 12.5px; font-weight: 400; fill: var(--muted, #5D6672)">分区 1，复制延迟大</tspan></text>
  <rect x="0" y="60" width="86%" height="8" rx="1" style="fill: var(--muted, #5D6672)" />

  <!-- the answer: partition 2, fast replication, 30-48% -->
  <text x="0" y="100" style="font-size: 14px; font-weight: 500; fill: var(--ink, #1B222B)">Cake 太太的回答<tspan dx="8" style="font-size: 12.5px; font-weight: 400; fill: var(--muted, #5D6672)">分区 2，复制延迟小</tspan></text>
  <rect x="30%" y="108" width="18%" height="8" rx="1" style="fill: var(--muted, #5D6672)" />

  <!-- the observer, reading from the followers: answer first, question second -->
  <text x="0" y="148" style="font-size: 14px; font-weight: 500; fill: var(--ink, #1B222B)">旁听者从追随者读到</text>
  <line x1="0" y1="172.5" x2="100%" y2="172.5" style="stroke: var(--rule-strong, #B1B8BB); stroke-width: 1" />
  <g style="stroke: var(--ink, #1B222B); stroke-width: 1.5">
    <line x1="48%" y1="166" x2="48%" y2="179" />
    <line x1="86%" y1="166" x2="86%" y2="179" />
  </g>
  <g text-anchor="middle" style="font-size: 12.5px; fill: var(--ink, #1B222B)">
    <text x="48%" y="196">先读到回答</text>
    <text x="86%" y="196">再读到问题</text>
  </g>
</svg>
