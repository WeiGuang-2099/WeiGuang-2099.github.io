<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="266" style="font-family: var(--font-text, 'Noto Serif SC', 'Songti SC', serif); overflow: visible">
  <!-- The book's profile-picture update with one synchronous and one asynchronous follower, drawn as a
       trace like the figures in DDIA notes 01. Time runs left to right: the client's request is the root
       span (0-64%); the leader writes locally (2-18%) and sends the change to both followers at 20%;
       follower 1 writes and acknowledges (20-58%), after which the leader answers the client (64%);
       follower 2 only finishes at 100%. The bracket marks 64-100%, when the client already has its "ok"
       but follower 2 still serves the old value. A dotted guide at 64% ties the "ok" on the axis to the
       bracket; it is drawn first so the bars cover it. Proportions are illustrative, not measured.
       No viewBox: text keeps its size, bars are placed in percentages. Colors are the site's tokens,
       with light-theme fallbacks. -->

  <!-- axis: the client sends the update (0%) and gets its "ok" (64%) -->
  <g style="font-size: 12.5px; fill: var(--muted, #5D6672)">
    <text x="0" y="12">客户端发出更新</text>
    <text x="64%" y="12" text-anchor="middle">客户端收到成功</text>
  </g>
  <line x1="0" y1="24.5" x2="100%" y2="24.5" style="stroke: var(--rule-strong, #B1B8BB); stroke-width: 1" />

  <!-- the moment of the "ok", down to the bracket -->
  <line x1="64%" y1="25" x2="64%" y2="250" style="stroke: var(--faint, #757D87); stroke-width: 1; stroke-dasharray: 2 3" />

  <!-- root span: the client's request, 0-64% -->
  <text x="0" y="52" style="font-size: 14px; font-weight: 500; fill: var(--ink, #1B222B)">客户端<tspan dx="8" style="font-size: 12.5px; font-weight: 400; fill: var(--muted, #5D6672)">等待写入完成</tspan></text>
  <rect x="0" y="60" width="64%" height="8" rx="1" style="fill: var(--ink, #1B222B)" />

  <!-- the leader writes to its own storage: 2-18% -->
  <text x="0" y="100" style="font-size: 14px; font-weight: 500; fill: var(--ink, #1B222B)">领导者<tspan dx="8" style="font-size: 12.5px; font-weight: 400; fill: var(--muted, #5D6672)">写入本地存储</tspan></text>
  <rect x="2%" y="108" width="16%" height="8" rx="1" style="fill: var(--muted, #5D6672)" />

  <!-- follower 1, synchronous: writes and acknowledges, 20-58%; the leader waits for it -->
  <text x="0" y="148" style="font-size: 14px; font-weight: 500; fill: var(--ink, #1B222B)">追随者 1<tspan dx="8" style="font-size: 12.5px; font-weight: 400; fill: var(--muted, #5D6672)">同步：写入并确认</tspan></text>
  <rect x="20%" y="156" width="38%" height="8" rx="1" style="fill: var(--muted, #5D6672)" />

  <!-- follower 2, asynchronous: the change arrives and is written, 20-100%; nobody waits for it -->
  <text x="0" y="196" style="font-size: 14px; font-weight: 500; fill: var(--ink, #1B222B)">追随者 2<tspan dx="8" style="font-size: 12.5px; font-weight: 400; fill: var(--muted, #5D6672)">异步：稍后写入</tspan></text>
  <rect x="20%" y="204" width="80%" height="8" rx="1" style="fill: var(--muted, #5D6672)" />

  <!-- the stale window: the client has its "ok", follower 2 has not caught up, 64-100% -->
  <text x="0" y="244" style="font-size: 14px; font-weight: 500; fill: var(--ink, #1B222B)">旧值窗口<tspan dx="8" style="font-size: 12.5px; font-weight: 400; fill: var(--muted, #5D6672)">追随者 2 还没写完</tspan></text>
  <g style="stroke: var(--ink, #1B222B); stroke-width: 1">
    <line x1="64%" y1="250" x2="64%" y2="262" />
    <line x1="64%" y1="256.5" x2="100%" y2="256.5" />
    <line x1="100%" y1="250" x2="100%" y2="262" transform="translate(-0.5 0)" />
  </g>
</svg>
