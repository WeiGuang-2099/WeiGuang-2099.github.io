<!-- English version of read-skew.svg, written by npm run translate from source 8da90f0a3cc64906. Adjust the layout here if a label does not fit; the file is only written again when read-skew.svg changes. -->
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="262" style="font-family: var(--font-text, 'Noto Serif SC', 'Songti SC', serif); overflow: visible">
  <!-- Read skew, after the book's example of Alice and her two bank accounts, drawn as a trace. Time runs
       left to right. Alice reads account 1 (0-24%) and later account 2 (76-100%); in between, a transfer
       adds 100 to account 1 (30-49%), takes 100 from account 2 (51-70%) and commits at 70%. A dotted guide
       at 70% marks the commit; it is drawn first so the bars cover it. Each of Alice's reads sees only
       committed data, yet the two add up to 900. Alice's bars are ink, the transfer's are muted, and the
       bracket at the bottom spans both of Alice's reads. Proportions are illustrative. No viewBox: text
       keeps its size, bars are placed in percentages. Colors are the site's tokens, with light-theme
       fallbacks. -->

  <!-- axis: the transfer commits at 70% -->
  <text x="70%" y="12" text-anchor="middle" style="font-size: 12.5px; fill: var(--muted, #5D6672)">transfer commits</text>
  <line x1="0" y1="24.5" x2="100%" y2="24.5" style="stroke: var(--rule-strong, #B1B8BB); stroke-width: 1" />
  <line x1="70%" y1="25" x2="70%" y2="212" style="stroke: var(--faint, #757D87); stroke-width: 1; stroke-dasharray: 2 3" />

  <!-- Alice reads account 1 before the transfer has committed -->
  <text x="0" y="52" style="font-size: 14px; font-weight: 500; fill: var(--ink, #1B222B)">Alice<tspan dx="8" style="font-size: 12.5px; font-weight: 400; fill: var(--muted, #5D6672)">reads account 1: 500</tspan></text>
  <rect x="0" y="60" width="24%" height="8" rx="1" style="fill: var(--ink, #1B222B)" />

  <!-- the transfer: +100 on account 1, then -100 on account 2, then commit -->
  <text x="0" y="100" style="font-size: 14px; font-weight: 500; fill: var(--ink, #1B222B)">transfer<tspan dx="8" style="font-size: 12.5px; font-weight: 400; fill: var(--muted, #5D6672)">account 1 +100 → 600</tspan></text>
  <rect x="30%" y="108" width="19%" height="8" rx="1" style="fill: var(--muted, #5D6672)" />
  <text x="0" y="148" style="font-size: 14px; font-weight: 500; fill: var(--ink, #1B222B)">transfer<tspan dx="8" style="font-size: 12.5px; font-weight: 400; fill: var(--muted, #5D6672)">account 2 −100 → 400</tspan></text>
  <rect x="51%" y="156" width="19%" height="8" rx="1" style="fill: var(--muted, #5D6672)" />

  <!-- Alice reads account 2 after the commit -->
  <text x="0" y="196" style="font-size: 14px; font-weight: 500; fill: var(--ink, #1B222B)">Alice<tspan dx="8" style="font-size: 12.5px; font-weight: 400; fill: var(--muted, #5D6672)">reads account 2: 400</tspan></text>
  <rect x="76%" y="204" width="24%" height="8" rx="1" style="fill: var(--ink, #1B222B)" />

  <!-- what Alice saw, across both reads -->
  <g style="stroke: var(--ink, #1B222B); stroke-width: 1">
    <line x1="0.5" y1="226" x2="0.5" y2="238" />
    <line x1="0" y1="232.5" x2="100%" y2="232.5" />
    <line x1="100%" y1="226" x2="100%" y2="238" transform="translate(-0.5 0)" />
  </g>
  <text x="50%" y="256" text-anchor="middle" style="font-size: 12.5px; fill: var(--muted, #5D6672)">Alice sees total: <tspan style="font-family: var(--font-mono, monospace); fill: var(--ink, #1B222B)">500 + 400 = 900</tspan></text>
</svg>
