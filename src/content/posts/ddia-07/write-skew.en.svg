<!-- English version of write-skew.svg, written by npm run translate from source 73e1995386f7630e. Adjust the layout here if a label does not fit; the file is only written again when write-skew.svg changes. -->
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="200" style="font-family: var(--font-text, 'Noto Serif SC', 'Songti SC', serif); overflow: visible">
  <!-- Write skew, after the book's on-call doctors, drawn as a trace under snapshot isolation. Time runs
       left to right. Alice's transaction reads how many doctors are on call (0-34%) and Bob's does the same
       a little later (8-42%); both see 2. Then Alice takes herself off call and commits (38-68%), and Bob
       does the same (46-76%). The reads are muted, the writes ink. Neither transaction writes what the
       other wrote, so both commit, and the bracket from 76% to the right edge is the state after both
       commits: nobody is on call. Proportions are illustrative. No viewBox: text keeps its size, bars are
       placed in percentages. Colors are the site's tokens, with light-theme fallbacks. -->

  <!-- both read the current number of doctors on call from their snapshots -->
  <text x="0" y="14" style="font-size: 14px; font-weight: 500; fill: var(--ink, #1B222B)">Alice<tspan dx="8" style="font-size: 12.5px; font-weight: 400; fill: var(--muted, #5D6672)">sees 2 on call, can leave</tspan></text>
  <rect x="0" y="22" width="34%" height="8" rx="1" style="fill: var(--muted, #5D6672)" />
  <text x="0" y="62" style="font-size: 14px; font-weight: 500; fill: var(--ink, #1B222B)">Bob<tspan dx="8" style="font-size: 12.5px; font-weight: 400; fill: var(--muted, #5D6672)">sees 2 on call, can leave</tspan></text>
  <rect x="8%" y="70" width="34%" height="8" rx="1" style="fill: var(--muted, #5D6672)" />

  <!-- each updates only their own row, then commits -->
  <text x="0" y="110" style="font-size: 14px; font-weight: 500; fill: var(--ink, #1B222B)">Alice<tspan dx="8" style="font-size: 12.5px; font-weight: 400; fill: var(--muted, #5D6672)">goes off call, commits</tspan></text>
  <rect x="38%" y="118" width="30%" height="8" rx="1" style="fill: var(--ink, #1B222B)" />
  <text x="0" y="158" style="font-size: 14px; font-weight: 500; fill: var(--ink, #1B222B)">Bob<tspan dx="8" style="font-size: 12.5px; font-weight: 400; fill: var(--muted, #5D6672)">goes off call, commits</tspan></text>
  <rect x="46%" y="166" width="30%" height="8" rx="1" style="fill: var(--ink, #1B222B)" />

  <!-- after both commits: the label sits left of the bracket -->
  <g style="stroke: var(--ink, #1B222B); stroke-width: 1">
    <line x1="76%" y1="182" x2="76%" y2="194" />
    <line x1="76%" y1="188.5" x2="100%" y2="188.5" />
    <line x1="100%" y1="182" x2="100%" y2="194" transform="translate(-0.5 0)" />
  </g>
  <text x="74%" y="193" text-anchor="end" style="font-size: 12.5px; fill: var(--muted, #5D6672)">after both commit: <tspan style="fill: var(--ink, #1B222B)">no one on call</tspan></text>
</svg>
