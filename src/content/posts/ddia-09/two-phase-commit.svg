<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="306" style="font-family: var(--font-text, 'Noto Serif SC', 'Songti SC', serif); overflow: visible">
  <!-- Two-phase commit with a coordinator crash, after the book's example. A sequence diagram with time
       running down: the coordinator at 16%, database 1 at 50%, database 2 at 84%. Prepare goes to each
       database (y 60, 84), both vote yes (y 112, 136), the coordinator writes its decision, the commit
       point (y 164), and sends commit to database 2 (y 196), which commits. The coordinator then crashes
       (y 232) before telling database 1; its lifeline goes on dashed. A bar along each database's lifeline
       marks the time it is in doubt, after voting yes: database 2 until the commit arrives, database 1 to
       the bottom of the figure. All messages are horizontal, so the arrowheads, drawn in nested svgs at the
       ends, hold at any width; labels next to a lifeline are offset in nested svgs too. No viewBox: text
       keeps its size, columns are placed in percentages. Colors are the site's tokens, with light-theme
       fallbacks. -->

  <!-- the three participants -->
  <g text-anchor="middle" style="font-size: 14px; font-weight: 500; fill: var(--ink, #1B222B)">
    <text x="16%" y="14">协调者</text>
    <text x="50%" y="14">数据库 1</text>
    <text x="84%" y="14">数据库 2</text>
  </g>
  <g style="stroke: var(--rule-strong, #B1B8BB); stroke-width: 1">
    <line x1="16%" y1="24" x2="16%" y2="226" />
    <line x1="50%" y1="24" x2="50%" y2="300" />
    <line x1="84%" y1="24" x2="84%" y2="300" />
  </g>
  <line x1="16%" y1="238" x2="16%" y2="300" style="stroke: var(--faint, #757D87); stroke-width: 1; stroke-dasharray: 2 3" />

  <!-- in doubt: after voting yes, until the outcome arrives -->
  <g style="fill: var(--muted, #5D6672)">
    <svg x="50%" y="112" overflow="visible"><rect x="-3" y="0" width="6" height="188" /></svg>
    <svg x="84%" y="136" overflow="visible"><rect x="-3" y="0" width="6" height="60" /></svg>
  </g>

  <!-- the messages: prepare and the votes (phase 1), then commit to database 2 (phase 2) -->
  <g style="stroke: var(--ink, #1B222B); stroke-width: 1">
    <line x1="16%" y1="60.5" x2="50%" y2="60.5" />
    <line x1="16%" y1="84.5" x2="84%" y2="84.5" />
    <line x1="50%" y1="112.5" x2="16%" y2="112.5" />
    <line x1="84%" y1="136.5" x2="16%" y2="136.5" />
    <line x1="16%" y1="196.5" x2="84%" y2="196.5" />
  </g>
  <g style="fill: var(--ink, #1B222B)">
    <svg x="50%" y="60.5" overflow="visible"><path d="M-8 -3.5V3.5L0 0Z" /></svg>
    <svg x="84%" y="84.5" overflow="visible"><path d="M-8 -3.5V3.5L0 0Z" /></svg>
    <svg x="16%" y="112.5" overflow="visible"><path d="M8 -3.5V3.5L0 0Z" /></svg>
    <svg x="16%" y="136.5" overflow="visible"><path d="M8 -3.5V3.5L0 0Z" /></svg>
    <svg x="84%" y="196.5" overflow="visible"><path d="M-8 -3.5V3.5L0 0Z" /></svg>
  </g>
  <g text-anchor="middle" style="font-size: 12.5px; fill: var(--muted, #5D6672)">
    <text x="33%" y="54">准备</text>
    <text x="67%" y="78">准备</text>
    <text x="33%" y="106">是</text>
    <text x="67%" y="130">是</text>
    <text x="67%" y="190">提交</text>
  </g>

  <!-- phase 2: the decision is written down, database 2 hears it, the coordinator crashes -->
  <svg x="16%" y="164.5" overflow="visible">
    <rect x="-7" y="-1.5" width="14" height="3" style="fill: var(--ink, #1B222B)" />
    <text x="12" y="4.5" style="font-size: 12.5px; fill: var(--ink, #1B222B)">提交点</text>
  </svg>
  <svg x="84%" y="216" overflow="visible">
    <text x="-10" y="0" text-anchor="end" style="font-size: 12.5px; fill: var(--muted, #5D6672)">已提交</text>
  </svg>
  <svg x="16%" y="232" overflow="visible">
    <path d="M-5 -5L5 5M5 -5L-5 5" style="fill: none; stroke: var(--ink, #1B222B); stroke-width: 1.5" />
    <text x="12" y="4.5" style="font-size: 12.5px; fill: var(--ink, #1B222B)">崩溃</text>
  </svg>
  <svg x="50%" y="264" overflow="visible">
    <text x="12" y="0" style="font-size: 12.5px; fill: var(--ink, #1B222B)">存疑</text>
  </svg>
</svg>
