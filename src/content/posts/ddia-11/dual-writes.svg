<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="214" style="font-family: var(--font-text, 'Noto Serif SC', 'Songti SC', serif); overflow: visible">
  <!-- Dual writes racing, after the book's example. A sequence diagram with time running down and four
       lifelines: client 1 at 12%, the database at 38%, the search index at 62%, client 2 at 88%. Each
       client writes item X to the database first and then to the search index: client 1 sets X = A, client
       2 sets X = B. The database receives A (y 52) and then B (y 80); the search index receives B (y 108)
       and then A (y 136). Each write is a horizontal arrow labelled with its value, placed between the
       sender and the first lifeline it crosses. Under the database and the index, their final values
       differ: X = B and X = A. All messages are horizontal, so the arrowheads, drawn in nested svgs at the
       line ends, hold at any width. No viewBox: text keeps its size, columns are placed in percentages.
       Colors are the site's tokens, with light-theme fallbacks. -->

  <!-- the four parties -->
  <g text-anchor="middle" style="font-size: 14px; font-weight: 500; fill: var(--ink, #1B222B)">
    <text x="12%" y="14">客户端 1</text>
    <text x="38%" y="14">数据库</text>
    <text x="62%" y="14">搜索索引</text>
    <text x="88%" y="14">客户端 2</text>
  </g>
  <g style="stroke: var(--rule-strong, #B1B8BB); stroke-width: 1">
    <line x1="12%" y1="24" x2="12%" y2="150" />
    <line x1="38%" y1="24" x2="38%" y2="160" />
    <line x1="62%" y1="24" x2="62%" y2="160" />
    <line x1="88%" y1="24" x2="88%" y2="150" />
  </g>

  <!-- the writes, in the order they arrive -->
  <g style="stroke: var(--ink, #1B222B); stroke-width: 1">
    <line x1="12%" y1="52.5" x2="38%" y2="52.5" />
    <line x1="88%" y1="80.5" x2="38%" y2="80.5" />
    <line x1="88%" y1="108.5" x2="62%" y2="108.5" />
    <line x1="12%" y1="136.5" x2="62%" y2="136.5" />
  </g>
  <g style="fill: var(--ink, #1B222B)">
    <svg x="38%" y="52.5" overflow="visible"><path d="M-8 -3.5V3.5L0 0Z" /></svg>
    <svg x="38%" y="80.5" overflow="visible"><path d="M8 -3.5V3.5L0 0Z" /></svg>
    <svg x="62%" y="108.5" overflow="visible"><path d="M8 -3.5V3.5L0 0Z" /></svg>
    <svg x="62%" y="136.5" overflow="visible"><path d="M-8 -3.5V3.5L0 0Z" /></svg>
  </g>
  <g text-anchor="middle" style="font-family: var(--font-mono, monospace); font-size: 12.5px; fill: var(--ink, #1B222B)">
    <text x="25%" y="46">X = A</text>
    <text x="75%" y="74">X = B</text>
    <text x="75%" y="102">X = B</text>
    <text x="25%" y="130">X = A</text>
  </g>

  <!-- where each system ends up -->
  <g text-anchor="middle" style="font-size: 12.5px">
    <text x="38%" y="180" style="fill: var(--muted, #5D6672)">最终<tspan dx="4" style="font-family: var(--font-mono, monospace); font-weight: 500; fill: var(--ink, #1B222B)">X = B</tspan></text>
    <text x="62%" y="180" style="fill: var(--muted, #5D6672)">最终<tspan dx="4" style="font-family: var(--font-mono, monospace); font-weight: 500; fill: var(--ink, #1B222B)">X = A</tspan></text>
    <text x="50%" y="204" style="fill: var(--muted, #5D6672)">两边永久不一致，却没有任何报错</text>
  </g>
</svg>
