<!-- English version of log-offsets.svg, written by npm run translate from source 50d09c59aceabfed. Adjust the layout here if a label does not fit; the file is only written again when log-offsets.svg changes. -->
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="180" style="font-family: var(--font-text, 'Noto Serif SC', 'Songti SC', serif); overflow: visible">
  <!-- A topic with two partitions, each an append-only log drawn as a row of cells holding the offsets
       (partition 0 at y 44-70 with offsets 0-8, partition 1 at y 150-176 with offsets 0-6). The row labels
       sit in the first 25% (wider than in the Chinese figure, to fit "partition 0" at 304px); every cell is
       7% wide, so cell i of a row spans 25+7i to 32+7i percent. A dashed cell after the last message is
       where the next one will be appended. Consumer group A has one consumer per partition, pointing down
       at offset 6 of partition 0 and offset 4 of partition 1; consumer group B, another application,
       points up at offset 2 of partition 0, where it is replaying old messages. All lines are vertical, so
       the arrowheads, drawn in nested svgs at the line ends, hold at any width. No viewBox: text keeps its
       size. Colors are the site's tokens, with light-theme fallbacks. -->

  <!-- partition 0 -->
  <text x="0" y="62" style="font-size: 14px; fill: var(--ink, #1B222B)">partition 0</text>
  <g style="fill: none; stroke: var(--rule-strong, #B1B8BB); stroke-width: 1">
    <rect x="25%" y="44.5" width="7%" height="26" />
    <rect x="32%" y="44.5" width="7%" height="26" />
    <rect x="39%" y="44.5" width="7%" height="26" />
    <rect x="46%" y="44.5" width="7%" height="26" />
    <rect x="53%" y="44.5" width="7%" height="26" />
    <rect x="60%" y="44.5" width="7%" height="26" />
    <rect x="67%" y="44.5" width="7%" height="26" />
    <rect x="74%" y="44.5" width="7%" height="26" />
    <rect x="81%" y="44.5" width="7%" height="26" />
  </g>
  <rect x="88%" y="44.5" width="7%" height="26" style="fill: none; stroke: var(--faint, #757D87); stroke-width: 1; stroke-dasharray: 2 3" />
  <g text-anchor="middle" style="font-family: var(--font-mono, monospace); font-size: 12.5px; fill: var(--ink, #1B222B)">
    <text x="28.5%" y="62">0</text>
    <text x="35.5%" y="62">1</text>
    <text x="42.5%" y="62">2</text>
    <text x="49.5%" y="62">3</text>
    <text x="56.5%" y="62">4</text>
    <text x="63.5%" y="62">5</text>
    <text x="70.5%" y="62">6</text>
    <text x="77.5%" y="62">7</text>
    <text x="84.5%" y="62">8</text>
  </g>

  <!-- partition 1 -->
  <text x="0" y="168" style="font-size: 14px; fill: var(--ink, #1B222B)">partition 1</text>
  <g style="fill: none; stroke: var(--rule-strong, #B1B8BB); stroke-width: 1">
    <rect x="25%" y="150.5" width="7%" height="26" />
    <rect x="32%" y="150.5" width="7%" height="26" />
    <rect x="39%" y="150.5" width="7%" height="26" />
    <rect x="46%" y="150.5" width="7%" height="26" />
    <rect x="53%" y="150.5" width="7%" height="26" />
    <rect x="60%" y="150.5" width="7%" height="26" />
    <rect x="67%" y="150.5" width="7%" height="26" />
  </g>
  <rect x="74%" y="150.5" width="7%" height="26" style="fill: none; stroke: var(--faint, #757D87); stroke-width: 1; stroke-dasharray: 2 3" />
  <g text-anchor="middle" style="font-family: var(--font-mono, monospace); font-size: 12.5px; fill: var(--ink, #1B222B)">
    <text x="28.5%" y="168">0</text>
    <text x="35.5%" y="168">1</text>
    <text x="42.5%" y="168">2</text>
    <text x="49.5%" y="168">3</text>
    <text x="56.5%" y="168">4</text>
    <text x="63.5%" y="168">5</text>
    <text x="70.5%" y="168">6</text>
  </g>

  <!-- the consumers: group A has one consumer per partition, group B replays partition 0 -->
  <g text-anchor="middle" style="font-size: 12.5px; fill: var(--ink, #1B222B)">
    <text x="70.5%" y="18">consumer 1 in group A</text>
    <text x="56.5%" y="124">consumer 2 in group A</text>
    <text x="42.5%" y="104">consumer in group B</text>
  </g>
  <text x="95%" y="87" text-anchor="end" style="font-size: 12.5px; fill: var(--muted, #5D6672)">new messages go here</text>
  <g style="stroke: var(--ink, #1B222B); stroke-width: 1">
    <line x1="70.5%" y1="24" x2="70.5%" y2="37" />
    <line x1="56.5%" y1="130" x2="56.5%" y2="143" />
    <line x1="42.5%" y1="79" x2="42.5%" y2="90" />
  </g>
  <g style="fill: var(--ink, #1B222B)">
    <svg x="70.5%" y="44" overflow="visible"><path d="M-3.5 -8H3.5L0 0Z" /></svg>
    <svg x="56.5%" y="150" overflow="visible"><path d="M-3.5 -8H3.5L0 0Z" /></svg>
    <svg x="42.5%" y="71" overflow="visible"><path d="M-3.5 8H3.5L0 0Z" /></svg>
  </g>
</svg>
