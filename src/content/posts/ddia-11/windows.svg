<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="170" style="font-family: var(--font-text, 'Noto Serif SC', 'Songti SC', serif); overflow: visible">
  <!-- Four kinds of window over the same events. Event time runs from 10:00 to 10:12 across x 22-100%
       (t minutes at 22 + 6.5t percent); the row labels sit in the first 22%. Top row: nine events as dots
       (at 0.5, 1.2, 2.4, 3.5, 4.2, 7.0, 7.5, 8.4 and 9.2 minutes), each continued down by a faint dashed
       guide. Each window is drawn as a dimension line, a rule with a short tick at each end. Tumbling:
       0-4, 4-8, 8-12. Hopping: 4-minute windows every 2 minutes, in two staggered rows. Sliding: the two
       events 3.5 minutes apart (3.5 and 7.0), in different tumbling windows but within one 4-minute
       sliding window. Session: 0.5-4.2 and 7.0-9.2, split by a gap of more than 2 minutes with no events.
       A time axis with ticks at 10:00, 10:04, 10:08 and 10:12 closes the figure. No viewBox: text keeps
       its size. Colors are the site's tokens, with light-theme fallbacks. -->

  <!-- the events, and faint guides down through the rows -->
  <g style="stroke: var(--faint, #757D87); stroke-width: 1; stroke-dasharray: 1 3">
    <line x1="25.25%" y1="14" x2="25.25%" y2="134" />
    <line x1="29.8%" y1="14" x2="29.8%" y2="134" />
    <line x1="37.6%" y1="14" x2="37.6%" y2="134" />
    <line x1="44.75%" y1="14" x2="44.75%" y2="134" />
    <line x1="49.3%" y1="14" x2="49.3%" y2="134" />
    <line x1="67.5%" y1="14" x2="67.5%" y2="134" />
    <line x1="70.75%" y1="14" x2="70.75%" y2="134" />
    <line x1="76.6%" y1="14" x2="76.6%" y2="134" />
    <line x1="81.8%" y1="14" x2="81.8%" y2="134" />
  </g>
  <g style="fill: var(--ink, #1B222B)">
    <circle cx="25.25%" cy="9" r="3" />
    <circle cx="29.8%" cy="9" r="3" />
    <circle cx="37.6%" cy="9" r="3" />
    <circle cx="44.75%" cy="9" r="3" />
    <circle cx="49.3%" cy="9" r="3" />
    <circle cx="67.5%" cy="9" r="3" />
    <circle cx="70.75%" cy="9" r="3" />
    <circle cx="76.6%" cy="9" r="3" />
    <circle cx="81.8%" cy="9" r="3" />
  </g>
  <g style="font-size: 12.5px; fill: var(--muted, #5D6672)">
    <text x="0" y="13">事件</text>
    <text x="0" y="41">滚动窗口</text>
    <text x="0" y="69">跳跃窗口</text>
    <text x="0" y="101">滑动窗口</text>
    <text x="0" y="129">会话窗口</text>
  </g>

  <!-- the windows, as dimension lines -->
  <g style="stroke: var(--ink, #1B222B); stroke-width: 1.5">
    <!-- tumbling: 0-4, 4-8, 8-12 -->
    <line x1="22%" y1="37" x2="100%" y2="37" />
    <line x1="22%" y1="32" x2="22%" y2="42" />
    <line x1="48%" y1="32" x2="48%" y2="42" />
    <line x1="74%" y1="32" x2="74%" y2="42" />
    <line x1="100%" y1="32" x2="100%" y2="42" />
    <!-- hopping: 0-4, 4-8, 8-12 above; 2-6, 6-10 below -->
    <line x1="22%" y1="59" x2="100%" y2="59" />
    <line x1="22%" y1="55" x2="22%" y2="63" />
    <line x1="48%" y1="55" x2="48%" y2="63" />
    <line x1="74%" y1="55" x2="74%" y2="63" />
    <line x1="100%" y1="55" x2="100%" y2="63" />
    <line x1="35%" y1="72" x2="87%" y2="72" />
    <line x1="35%" y1="68" x2="35%" y2="76" />
    <line x1="61%" y1="68" x2="61%" y2="76" />
    <line x1="87%" y1="68" x2="87%" y2="76" />
    <!-- sliding: the events at 3.5 and 7.0 minutes -->
    <line x1="44.75%" y1="97" x2="67.5%" y2="97" />
    <line x1="44.75%" y1="92" x2="44.75%" y2="102" />
    <line x1="67.5%" y1="92" x2="67.5%" y2="102" />
    <!-- session: 0.5-4.2 and 7.0-9.2 -->
    <line x1="25.25%" y1="125" x2="49.3%" y2="125" />
    <line x1="25.25%" y1="120" x2="25.25%" y2="130" />
    <line x1="49.3%" y1="120" x2="49.3%" y2="130" />
    <line x1="67.5%" y1="125" x2="81.8%" y2="125" />
    <line x1="67.5%" y1="120" x2="67.5%" y2="130" />
    <line x1="81.8%" y1="120" x2="81.8%" y2="130" />
  </g>
  <text x="58.4%" y="121" text-anchor="middle" style="font-size: 12.5px; fill: var(--muted, #5D6672)">超时</text>

  <!-- the time axis -->
  <line x1="22%" y1="146.5" x2="100%" y2="146.5" style="stroke: var(--rule-strong, #B1B8BB); stroke-width: 1" />
  <g style="stroke: var(--rule-strong, #B1B8BB); stroke-width: 1">
    <line x1="22%" y1="143" x2="22%" y2="150" />
    <line x1="48%" y1="143" x2="48%" y2="150" />
    <line x1="74%" y1="143" x2="74%" y2="150" />
    <line x1="100%" y1="143" x2="100%" y2="150" />
  </g>
  <g style="font-family: var(--font-mono, monospace); font-size: 12.5px; fill: var(--muted, #5D6672)">
    <text x="22%" y="166" text-anchor="middle">10:00</text>
    <text x="48%" y="166" text-anchor="middle">10:04</text>
    <text x="74%" y="166" text-anchor="middle">10:08</text>
    <text x="100%" y="166" text-anchor="end">10:12</text>
  </g>
</svg>
