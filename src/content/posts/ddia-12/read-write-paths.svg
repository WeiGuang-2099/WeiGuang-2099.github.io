<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="222" style="font-family: var(--font-text, 'Noto Serif SC', 'Songti SC', serif); overflow: visible">
  <!-- Where the write path ends and the read path begins, for full-text search done three ways. A key at
       the top: the write path (work done ahead of time) in ink, the read path (work done when someone
       asks) in muted grey. Then three rows (at 36, 98 and 160px), each a title, an 8px bar across the
       full width split at the boundary, and a line under it saying what each side does: no index, the
       boundary at 6% (nothing to do on write, a scan of every document on read); a full-text index, at
       50%; a cache of the results of common queries, at 86%. The proportions are illustrative. No viewBox:
       text keeps its size, the bars are placed in percentages. Colors are the site's tokens, with
       light-theme fallbacks. -->

  <!-- the key -->
  <g style="font-size: 12.5px; fill: var(--muted, #5D6672)">
    <rect x="0" y="5" width="14" height="8" rx="1" style="fill: var(--ink, #1B222B)" />
    <text x="20" y="13">写路径：提前做</text>
    <svg x="50%" y="0" overflow="visible">
      <rect x="0" y="5" width="14" height="8" rx="1" style="fill: var(--muted, #5D6672)" />
      <text x="20" y="13">读路径：请求时才做</text>
    </svg>
  </g>

  <!-- three places to draw the boundary -->
  <g style="font-size: 14px; font-weight: 500; fill: var(--ink, #1B222B)">
    <text x="0" y="50">不建索引</text>
    <text x="0" y="112">全文索引</text>
    <text x="0" y="174">缓存常见查询的结果</text>
  </g>
  <g style="fill: var(--ink, #1B222B)">
    <rect x="0" y="60" width="6%" height="8" rx="1" />
    <rect x="0" y="122" width="50%" height="8" rx="1" />
    <rect x="0" y="184" width="86%" height="8" rx="1" />
  </g>
  <g style="fill: var(--muted, #5D6672)">
    <rect x="6.5%" y="60" width="93.5%" height="8" rx="1" />
    <rect x="50.5%" y="122" width="49.5%" height="8" rx="1" />
    <rect x="86.5%" y="184" width="13.5%" height="8" rx="1" />
  </g>
  <g style="font-size: 12.5px; fill: var(--muted, #5D6672)">
    <text x="0" y="86">写入时什么也不做</text>
    <text x="100%" y="86" text-anchor="end">查询时扫描所有文档</text>
    <text x="0" y="148">写入时更新索引</text>
    <text x="100%" y="148" text-anchor="end">查询时查索引</text>
    <text x="0" y="210">写入时更新缓存</text>
    <text x="100%" y="210" text-anchor="end">查询时直接取结果</text>
  </g>
</svg>
