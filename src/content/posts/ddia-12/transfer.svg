<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="262" style="font-family: var(--font-text, 'Noto Serif SC', 'Songti SC', serif); overflow: visible">
  <!-- A transfer of 11.00 from account A to account B across partitions, without atomic commit, after the
       book's example. Top to bottom: the request, with its request ID r42, is appended as one message to
       the request log (a box across the full width, y 24-64); a stream processor (y 88-116) turns it into
       two instructions that carry the same request ID; the line splits at y 126 into the two columns
       (0-47.5% and 52-99.5%, centres at 24% and 76%): a debit to account A's partition and a credit to
       account B's partition (y 146-190); below them, the consumers that drop duplicates by request ID and
       apply the change to each balance (y 212-256). All lines are horizontal or vertical, so the
       arrowheads, drawn in nested svgs at the line ends, hold at any width. No viewBox: text keeps its
       size. Colors are the site's tokens, with light-theme fallbacks. -->

  <!-- the request log -->
  <text x="0" y="14" style="font-size: 14px; font-weight: 500; fill: var(--ink, #1B222B)">请求日志<tspan dx="8" style="font-size: 12.5px; font-weight: 400; fill: var(--muted, #5D6672)">按请求 ID 分区，一条消息写入就是原子的</tspan></text>
  <rect x="0.5" y="24.5" width="99%" height="40" style="fill: none; stroke: var(--ink, #1B222B); stroke-width: 1" />
  <text x="50%" y="49" text-anchor="middle" style="font-family: var(--font-mono, monospace); font-size: 12.5px; fill: var(--ink, #1B222B)">r42<tspan dx="10" style="font-family: var(--font-text, serif)">A 向 B 转账</tspan><tspan dx="8">11.00</tspan></text>

  <!-- one stream processor derives two instructions -->
  <rect x="0.5" y="88.5" width="99%" height="28" style="fill: var(--tint, #ECEEEA); stroke: var(--rule-strong, #B1B8BB); stroke-width: 1" />
  <text x="50%" y="107" text-anchor="middle" style="font-size: 14px; fill: var(--ink, #1B222B)">流处理器<tspan dx="8" style="font-size: 12.5px; fill: var(--muted, #5D6672)">拆成两条指令，都带着 r42</tspan></text>

  <!-- an instruction for each account's partition, then the consumers that apply them -->
  <g style="fill: none; stroke: var(--rule-strong, #B1B8BB); stroke-width: 1">
    <rect x="0.5" y="146.5" width="47.5%" height="44" />
    <rect x="52%" y="146.5" width="47.5%" height="44" />
    <rect x="0.5" y="212.5" width="47.5%" height="44" />
    <rect x="52%" y="212.5" width="47.5%" height="44" />
  </g>
  <g style="stroke: var(--ink, #1B222B); stroke-width: 1">
    <line x1="50%" y1="65" x2="50%" y2="81" />
    <line x1="50%" y1="117" x2="50%" y2="126.5" />
    <line x1="24%" y1="126.5" x2="76%" y2="126.5" />
    <line x1="24%" y1="126" x2="24%" y2="139" />
    <line x1="76%" y1="126" x2="76%" y2="139" />
    <line x1="24%" y1="191" x2="24%" y2="205" />
    <line x1="76%" y1="191" x2="76%" y2="205" />
  </g>
  <g style="fill: var(--ink, #1B222B)">
    <svg x="50%" y="88" overflow="visible"><path d="M-3.5 -8H3.5L0 0Z" /></svg>
    <svg x="24%" y="146" overflow="visible"><path d="M-3.5 -8H3.5L0 0Z" /></svg>
    <svg x="76%" y="146" overflow="visible"><path d="M-3.5 -8H3.5L0 0Z" /></svg>
    <svg x="24%" y="212" overflow="visible"><path d="M-3.5 -8H3.5L0 0Z" /></svg>
    <svg x="76%" y="212" overflow="visible"><path d="M-3.5 -8H3.5L0 0Z" /></svg>
  </g>
  <g text-anchor="middle">
    <g style="font-size: 14px; fill: var(--ink, #1B222B)">
      <text x="24%" y="165">账户 A 的分区</text>
      <text x="76%" y="165">账户 B 的分区</text>
      <text x="24%" y="231">按请求 ID 去重</text>
      <text x="76%" y="231">按请求 ID 去重</text>
    </g>
    <g style="font-size: 12.5px; fill: var(--muted, #5D6672)">
      <text x="24%" y="183">扣款<tspan dx="6" style="font-family: var(--font-mono, monospace); fill: var(--ink, #1B222B)">11.00 r42</tspan></text>
      <text x="76%" y="183">入账<tspan dx="6" style="font-family: var(--font-mono, monospace); fill: var(--ink, #1B222B)">11.00 r42</tspan></text>
      <text x="24%" y="249">A 的余额减少</text>
      <text x="76%" y="249">B 的余额增加</text>
    </g>
  </g>
</svg>
