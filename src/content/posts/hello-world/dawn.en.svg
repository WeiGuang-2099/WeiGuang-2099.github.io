<!-- English version of dawn.svg, written by npm run translate from source 856377752d57cbbf. Adjust the layout here if a label does not fit; the file is only written again when dawn.svg changes. -->
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="176" style="font-family: var(--font-text, 'Noto Sans SC', 'PingFang SC', sans-serif); overflow: visible">
  <!-- Trace-style waterfall of morning twilight. The time axis runs from 90 minutes before sunrise (0%) to
       sunrise (100%); 1 minute = 1/90 of the width. No viewBox: text keeps its size at any width, the
       bars are placed in percentages. Colors are the site's tokens (with light-theme fallbacks), so the
       inlined figure follows the theme toggle. Brightness grows in three steps, never a gradient. -->

  <!-- axis: labels, baseline, ticks at -90 / -60 / -30 / 0 min (U+2212 minus; short, so the first label
       clears the -60 tick even in a 280px wide figure) -->
  <g style="font-size: 12.5px; fill: var(--muted, #596170)">
    <text x="0" y="12">−90 min</text>
    <text x="33.333%" y="12" text-anchor="middle">−60</text>
    <text x="66.667%" y="12" text-anchor="middle">−30</text>
    <text x="100%" y="12" text-anchor="end" style="fill: var(--ink, #13161B); font-weight: 500">sunrise</text>
  </g>
  <line x1="0" y1="24.5" x2="100%" y2="24.5" style="stroke: var(--rule-strong, #B4BAC4); stroke-width: 1" />
  <g style="stroke: var(--rule-strong, #B4BAC4); stroke-width: 1">
    <line x1="0.5" y1="19" x2="0.5" y2="24" />
    <line x1="33.333%" y1="19" x2="33.333%" y2="24" />
    <line x1="66.667%" y1="19" x2="66.667%" y2="24" />
  </g>

  <!-- astronomical twilight: -89 to -58 min -->
  <text x="0" y="52" style="font-size: 14px; font-weight: 500; fill: var(--ink, #13161B)">astronomical twilight<tspan dx="8" style="font-size: 12.5px; font-weight: 400; fill: var(--muted, #596170)"></tspan></text>
  <text x="100%" dx="-14" y="52" text-anchor="end" style="font-size: 12.5px; fill: var(--muted, #596170)">31 min</text>
  <rect x="1.111%" y="60" width="34.444%" height="8" rx="1" style="fill: var(--sky-1, #13161B)" />

  <!-- nautical twilight: -58 to -27 min -->
  <text x="0" y="100" style="font-size: 14px; font-weight: 500; fill: var(--ink, #13161B)">nautical twilight<tspan dx="8" style="font-size: 12.5px; font-weight: 400; fill: var(--muted, #596170)"></tspan></text>
  <text x="100%" dx="-14" y="100" text-anchor="end" style="font-size: 12.5px; fill: var(--muted, #596170)">31 min</text>
  <rect x="35.556%" y="108" width="34.444%" height="8" rx="1" style="fill: var(--sky-2, #596170)" />

  <!-- civil twilight: -27 to 0 min -->
  <text x="0" y="148" style="font-size: 14px; font-weight: 500; fill: var(--ink, #13161B)">civil twilight<tspan dx="8" style="font-size: 12.5px; font-weight: 400; fill: var(--muted, #596170)"></tspan></text>
  <text x="100%" dx="-14" y="148" text-anchor="end" style="font-size: 12.5px; fill: var(--muted, #596170)">27 min</text>
  <rect x="70%" y="156" width="30%" height="8" rx="1" style="fill: var(--sky-3, #A9B0BB)" />

  <!-- sunrise marker -->
  <line x1="100%" y1="19" x2="100%" y2="172" style="stroke: var(--ink, #13161B); stroke-width: 1.5" />
</svg>
